; PlatformIO Project Configuration File
;
; LilyGo T-Watch Ultra - ESP32-S3 with CO5300 QSPI AMOLED
; Uses ArduinoGFX backend (TFT_eSPI doesn't support QSPI)

[env:lilygo-t-watch-ultra]
board = lilygo-t-watch-ultra
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/lilygo-t-watch-ultra>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-watch-ultra
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw
	-Os
	-DCORE_DEBUG_LEVEL=1

	; Display backend: ArduinoGFX (required for QSPI CO5300)
	-DUSE_ARDUINO_GFX=1

	; QSPI Data Bus (TFT_DATABUS_N=1)
	-DTFT_DATABUS_N=1

	; CO5300 Display Driver (TFT_DISPLAY_DRIVER_N=41)
	-DTFT_DISPLAY_DRIVER_N=41

	; Display dimensions: CO5300 native 502x410 (portrait)
	-DTFT_WIDTH=502
	-DTFT_HEIGHT=410

	; CO5300 column offset: SC=22 (from LovyanGFX Panel_CO5300)
	-DTFT_COL_OFS1=22
	-DTFT_ROW_OFS1=0
	-DTFT_COL_OFS2=0
	-DTFT_ROW_OFS2=0

	; Rotation 0 = portrait (CO5300 does not support hardware rotation)
	-DTFT_ROTATION=0

	; QSPI display pins
	-DTFT_CS=41
	-DTFT_SCLK=40
	-DTFT_D0=38
	-DTFT_D1=39
	-DTFT_D2=42
	-DTFT_D3=45
	-DTFT_RST=37

	; Remove RFID HW interface (no external GPIO for RFID)
	-DREMOVE_RFID_HW_INTERFACE

	; Features Enabled

	; Microphone (PDM T3902)
	-DHAS_PDM_MIC=1
	-DPIN_CLK=17
	-DI2S_SCLK_PIN=17
	-DI2S_DATA_PIN=18
	-DPIN_DATA=18

	; SERIAL (GPS) dedicated pins
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	; Speaker (MAX98357A I2S)
	-DHAS_NS4168_SPKR=1
	-DBCLK=9
	-DWCLK=10
	-DDOUT=11
	-DMCLK=-1

	; Battery ADC read pin (not used with AXP2101)
	-DBAT_PIN=-1

	; Buttons (only POWER button, no separate buttons)
	-DHAS_BTN=0

	; Infrared (no IR LED)
	-DIR_TX_PINS='{{"Unavailable", -1}}'
	-DIR_RX_PINS='{{"Unavailable", -1}}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; Radio Frequency (no RF module)
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'

	; CC1101 SPI connection pins (not connected)
	-DCC1101_GDO0_PIN=-1
	-DCC1101_SS_PIN=-1
	-DCC1101_MOSI_PIN=34
	-DCC1101_SCK_PIN=35
	-DCC1101_MISO_PIN=33

	; NRF24 (not connected)
	-DNRF24_CE_PIN=-1
	-DNRF24_SS_PIN=-1
	-DNRF24_MOSI_PIN=34
	-DNRF24_SCK_PIN=35
	-DNRF24_MISO_PIN=33

	; W5500 Ethernet (not connected)
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=34
	-DW5500_SCK_PIN=35
	-DW5500_MISO_PIN=33
	-DW5500_INT_PIN=-1

	; LoRa SX1262
	-DLORA_SCK=35
	-DLORA_MISO=33
	-DLORA_MOSI=34
	-DLORA_CS=36
	-DLORA_RST=47
	-DLORA_DIO0=14

	; Font sizes
	-DFP=1
	-DFM=2
	-DFG=3

	; Screen Setup
	-DHAS_SCREEN=1
	-DROTATION=0
	-DBACKLIGHT=-1
	-DMINBRIGHT=1

	; TFT Brightness Control (AMOLED via AXP2101 ALDO2)
	-DTFT_BRIGHT_CHANNEL=3
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=1000

	; Touch Controller CST9217
	-DHAS_TOUCH=1

	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; SD Card Setup pins (shares SPI bus)
	-DSDCARD_CS=21
	-DSDCARD_SCK=35
	-DSDCARD_MISO=33
	-DSDCARD_MOSI=34

	; Default I2C port
	-DGROVE_SDA=3
	-DGROVE_SCL=2

	-DSPI_SCK_PIN=35
	-DSPI_MOSI_PIN=34
	-DSPI_MISO_PIN=33
	-DSPI_SS_PIN=21

	; XL9555 IO Expander
	-DIO_EXPANDER_ADDRESS=0x20

	-DDEVICE_NAME='"Lilygo T-Watch Ultra"'

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.2.7
	lewisxhe/SensorLib@0.3.4
	; ArduinoGFX for CO5300 QSPI AMOLED
	https://github.com/moononournation/Arduino_GFX.git#v1.6.6
